<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#4F46E5;
  --primary-dark:#3730A3;
  --primary-light:#EEF0FF;
  --bg:#F4F5FA;
  --card:#FFFFFF;
  --text:#1F2333;
  --text-2:#6B7280;
  --border:#E7E8F0;
  --success:#16A34A;
  --success-bg:#DCFCE7;
  --danger:#DC2626;
  --danger-bg:#FEE2E2;
  --warn:#D97706;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:76px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
label{font-size:12.5px;color:var(--text-2);display:block;margin-bottom:6px;font-weight:500;}
.field{margin-bottom:14px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-size:14.5px;font-weight:700;transition:.15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:active{background:var(--bg);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:19px;font-weight:700;}
.page{padding:0 18px 24px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.icon{width:20px;height:20px;flex-shrink:0;}
.icon-sm{width:16px;height:16px;}
.center{display:flex;align-items:center;justify-content:center;}
.between{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--text-2);}
.hidden{display:none !important;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 28px;max-height:88vh;overflow-y:auto;animation:slideup .2s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:30;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--text-2);font-size:10.5px;font-weight:500;}
.navitem.active{color:var(--primary);}
.prod-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center;position:relative;}
.prod-card:active{background:var(--primary-light);border-color:var(--primary);}
.cart-fab{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:484px;background:var(--primary);color:#fff;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:25;box-shadow:0 8px 20px rgba(79,70,229,.35);}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;}
.stat-card .val{font-size:21px;font-weight:700;margin-top:2px;}
.tabbar{display:flex;background:var(--primary-light);border-radius:11px;padding:4px;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--primary);}
.tab.active{background:#fff;}
.err-text{color:var(--danger);font-size:12.5px;margin-top:5px;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1F2333;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;z-index:200;max-width:90%;text-align:center;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
.spinner-dark{border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:50px 20px;color:var(--text-2);}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;}
.logo-upload{width:76px;height:76px;border-radius:16px;background:var(--primary-light);border:1.5px dashed var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--primary);}
.logo-upload img{width:100%;height:100%;object-fit:cover;}
#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;top:0;left:0;width:80mm;padding:2mm;font-size:11px;}
  #print-area.w58{width:58mm;font-size:9.5px;}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="print-area"></div>

<script>
/* ============ إعداد Supabase ============ */
const SUPABASE_URL = "https://kacwmlurtzzoytnrhwrn.supabase.co";
const SUPABASE_KEY = "sb_publishable_rr393elFVvyZFZReUSXAUw_oLUOggU7";

const memoryStorage = (() => {
  let store = {};
  return {
    getItem: k => (k in store ? store[k] : null),
    setItem: (k,v) => { store[k]=v; },
    removeItem: k => { delete store[k]; }
  };
})();

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storage: memoryStorage, persistSession: true, autoRefreshToken: true }
});

/* ============ الحالة العامة ============ */
const state = {
  view: "loading",
  user: null,
  company: null,
  customers: [],
  products: [],
  invoices: [],
  cart: [],
  modal: null,
  toastMsg: null,
  authMode: "login",
  authError: "",
  authLoading: false,
  checkout: { customerId: "", payment: "cash", discount: 0, manualDesc: "", manualPrice: "" },
  editItem: null,
  lastInvoice: null,
  dashboard: null,
  navMoreOpen: false
};

function showToast(msg){
  state.toastMsg = msg;
  render();
  setTimeout(()=>{ state.toastMsg = null; render(); }, 2200);
}

function money(n){
  return (Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

/* ============ الأيقونات (SVG بسيطة) ============ */
const ICONS = {
  home:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  list:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  chart:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  more:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
  plus:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cart:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 002 1.6h8.4a2 2 0 002-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>',
  user:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>',
  box:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  settings:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  logout:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  whatsapp:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1112 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-1.4-.7-2.3-1.3-3.2-2.9-.2-.4.2-.4.6-1.2.1-.1 0-.3 0-.4L9 8.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2 0 1.2.9 2.3 1 2.5.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>',
  print:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18h12v4H6zM4 9h16v7H4z"/></svg>',
  edit:'<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>',
  check:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  store:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9v11h16V9M4 9h16"/></svg>',
  search:'<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
  cash:'<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',
  card:'<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  bank:'<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 21V10M20 21V10M2 10l10-6 10 6M6 10v11M18 10v11M10 10v11M14 10v11"/></svg>',
  back:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>'
};

/* ============ تحميل بيانات المستخدم ============ */
async function loadAllData(){
  const uid = state.user.id;
  const [company, customers, products, invoices] = await Promise.all([
    sb.from('company_settings').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('customers').select('*').eq('user_id', uid).order('created_at',{ascending:false}),
    sb.from('products').select('*').eq('user_id', uid).order('created_at',{ascending:false}),
    sb.from('invoices').select('*, customers(name)').eq('user_id', uid).order('created_at',{ascending:false}).limit(200)
  ]);
  state.company = company.data || null;
  state.customers = customers.data || [];
  state.products = products.data || [];
  state.invoices = invoices.data || [];
}

async function initApp(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.user = session.user;
    await loadAllData();
    state.view = state.company ? "pos" : "setup_company";
  } else {
    state.view = "auth";
  }
  render();
}

sb.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_OUT"){
    state.user = null; state.company=null; state.customers=[]; state.products=[]; state.invoices=[];
    state.view = "auth"; render();
  }
});

/* ============ المصادقة ============ */
async function handleAuthSubmit(email, password){
  state.authError = ""; state.authLoading = true; render();
  try{
    if(state.authMode === "signup"){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session){
        state.user = data.user;
        await loadAllData();
        state.view = "setup_company";
      } else {
        state.authLoading = false;
        showToast("تم إنشاء الحساب! تحقق من بريدك لتأكيد الحساب ثم سجل دخول");
        state.authMode = "login";
        render();
        return;
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      state.user = data.user;
      await loadAllData();
      state.view = state.company ? "pos" : "setup_company";
    }
  }catch(e){
    state.authError = e.message.includes("Invalid login") ? "البريد أو كلمة المرور غير صحيحة" :
                       e.message.includes("confirm") ? "لازم تأكد بريدك الإلكتروني أولاً (تحقق من الإيميل)" :
                       e.message;
  }
  state.authLoading = false;
  render();
}

async function handleLogout(){
  await sb.auth.signOut();
}

/* ============ حفظ بيانات المنشأة ============ */
async function saveCompany(form, logoFile){
  let logo_url = state.company?.logo_url || null;
  if(logoFile){
    const path = `${state.user.id}/logo.png`;
    const { error: upErr } = await sb.storage.from('logos').upload(path, logoFile, { upsert:true, contentType: logoFile.type });
    if(!upErr){
      const { data } = sb.storage.from('logos').getPublicUrl(path);
      logo_url = data.publicUrl + "?t=" + Date.now();
    }
  }
  const payload = { ...form, logo_url, user_id: state.user.id, updated_at: new Date().toISOString() };
  let res;
  if(state.company){
    res = await sb.from('company_settings').update(payload).eq('id', state.company.id).select().single();
  } else {
    res = await sb.from('company_settings').insert(payload).select().single();
  }
  if(res.error){ showToast("حصل خطأ: " + res.error.message); return; }
  state.company = res.data;
  showToast("تم الحفظ بنجاح");
  state.view = "pos";
  render();
}

/* ============ عملاء ============ */
async function saveCustomer(form){
  const payload = { ...form, user_id: state.user.id };
  let res;
  if(state.editItem){
    res = await sb.from('customers').update(payload).eq('id', state.editItem.id).select().single();
  } else {
    res = await sb.from('customers').insert(payload).select().single();
  }
  if(res.error){ showToast("خطأ: " + res.error.message); return; }
  if(state.editItem) state.customers = state.customers.map(c=>c.id===res.data.id?res.data:c);
  else state.customers = [res.data, ...state.customers];
  state.modal = null; state.editItem = null;
  showToast("تم حفظ العميل");
  render();
}
async function deleteCustomer(id){
  await sb.from('customers').delete().eq('id', id);
  state.customers = state.customers.filter(c=>c.id!==id);
  render();
}

/* ============ منتجات ============ */
async function saveProduct(form){
  const payload = { ...form, price: parseFloat(form.price)||0, user_id: state.user.id };
  let res;
  if(state.editItem){
    res = await sb.from('products').update(payload).eq('id', state.editItem.id).select().single();
  } else {
    res = await sb.from('products').insert(payload).select().single();
  }
  if(res.error){ showToast("خطأ: " + res.error.message); return; }
  if(state.editItem) state.products = state.products.map(p=>p.id===res.data.id?res.data:p);
  else state.products = [res.data, ...state.products];
  state.modal = null; state.editItem = null;
  showToast("تم حفظ المنتج");
  render();
}
async function deleteProduct(id){
  await sb.from('products').delete().eq('id', id);
  state.products = state.products.filter(p=>p.id!==id);
  render();
}

/* ============ السلة ============ */
function addProductToCart(product){
  const existing = state.cart.find(i=>i.product_id===product.id);
  if(existing){ existing.quantity += 1; existing.line_total = existing.quantity*existing.unit_price; }
  else state.cart.push({ product_id: product.id, description: product.name, quantity:1, unit_price: product.price, line_total: product.price });
  render();
}
function changeQty(idx, delta){
  const item = state.cart[idx];
  item.quantity = Math.max(1, item.quantity + delta);
  item.line_total = item.quantity * item.unit_price;
  render();
}
function removeCartItem(idx){ state.cart.splice(idx,1); render(); }
function addManualItem(desc, price){
  if(!desc || !price || isNaN(parseFloat(price))) return;
  state.cart.push({ product_id:null, description:desc, quantity:1, unit_price: parseFloat(price), line_total: parseFloat(price) });
  render();
}
function cartSubtotal(){ return state.cart.reduce((s,i)=>s+i.line_total,0); }

/* ============ إنشاء الفاتورة ============ */
async function confirmInvoice(){
  if(state.cart.length===0){ showToast("السلة فارغة"); return; }
  const subtotal = cartSubtotal();
  const discount = parseFloat(state.checkout.discount)||0;
  const taxable = Math.max(0, subtotal - discount);
  const tax = Math.round(taxable*0.15*100)/100;
  const total = Math.round((taxable+tax)*100)/100;

  const { data: numData, error: numErr } = await sb.rpc('generate_invoice_number', { p_user_id: state.user.id });
  if(numErr){ showToast("خطأ بترقيم الفاتورة: "+numErr.message); return; }

  const invoicePayload = {
    user_id: state.user.id,
    invoice_number: numData,
    customer_id: state.checkout.customerId || null,
    subtotal, discount, tax, total,
    status: 'paid',
    payment_method: state.checkout.payment,
  };
  const { data: inv, error: invErr } = await sb.from('invoices').insert(invoicePayload).select().single();
  if(invErr){ showToast("خطأ: "+invErr.message); return; }

  const items = state.cart.map(i=>({
    invoice_id: inv.id, product_id: i.product_id, description: i.description,
    quantity: i.quantity, unit_price: i.unit_price, line_total: i.line_total
  }));
  await sb.from('invoice_items').insert(items);

  const customer = state.customers.find(c=>c.id===state.checkout.customerId);
  state.lastInvoice = { ...inv, items, customer: customer||null };
  state.invoices = [{...inv, customers: customer?{name:customer.name}:null}, ...state.invoices];
  state.cart = [];
  state.checkout = { customerId:"", payment:"cash", discount:0, manualDesc:"", manualPrice:"" };
  state.modal = null;
  state.view = "invoice_view";
  render();
}

/* ============ عرض فاتورة سابقة ============ */
async function openInvoice(invoiceId){
  const { data: inv } = await sb.from('invoices').select('*, customers(*)').eq('id', invoiceId).single();
  const { data: items } = await sb.from('invoice_items').select('*').eq('invoice_id', invoiceId);
  state.lastInvoice = { ...inv, items, customer: inv.customers };
  state.view = "invoice_view";
  render();
}

/* ============ طباعة ============ */
function printInvoice(width){
  const inv = state.lastInvoice;
  const c = state.company;
  const area = document.getElementById('print-area');

/* ============ توليد PDF ============ */
function generatePdfBlob(){
  const inv = state.lastInvoice;
  const c = state.company;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:[80, 150 + inv.items.length*6] });
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  let y = 8;
  doc.text(c?.name||'', 40, y, {align:'center'}); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(c?.address||'', 40, y, {align:'center'}); y+=4;
  doc.text(c?.phone||'', 40, y, {align:'center'}); y+=6;
  doc.text(`Invoice #${inv.invoice_number}`, 40, y, {align:'center'}); y+=4;
  doc.text(new Date(inv.created_at).toLocaleDateString(), 40, y, {align:'center'}); y+=4;
  doc.text(`Customer: ${inv.customer?.name || 'Walk-in'}`, 40, y, {align:'center'}); y+=6;
  doc.setDrawColor(150); doc.line(4,y,76,y); y+=5;
  inv.items.forEach(i=>{
    doc.text(`${i.description} x${i.quantity}`, 4, y);
    doc.text(money(i.line_total), 76, y, {align:'right'});
    y+=5;
  });
  doc.line(4,y,76,y); y+=5;
  doc.text('Subtotal', 4, y); doc.text(money(inv.subtotal), 76, y, {align:'right'}); y+=5;
  doc.text('Discount', 4, y); doc.text(money(inv.discount), 76, y, {align:'right'}); y+=5;
  doc.text('VAT 15%', 4, y); doc.text(money(inv.tax), 76, y, {align:'right'}); y+=5;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Total', 4, y); doc.text(money(inv.total)+' SAR', 76, y, {align:'right'});
  return doc.output('blob');
}

/* ============ مشاركة واتساب ============ */
async function shareWhatsapp(){
  const inv = state.lastInvoice;
  const c = state.company;
  const companyName = c?.name || '';
  const text = `*عزيزنا العميل*\n\nنشكر لكم زيارة "${companyName}"، ويمكنكم الاطلاع على فاتورتكم رقم ${inv.invoice_number}.\n\n*Dear Customer*\n\nThank you for visiting "${companyName}", please find your purchase invoice #${inv.invoice_number}.`;
  const blob = generatePdfBlob();
  const file = new File([blob], `invoice-${inv.invoice_number}.pdf`, { type:'application/pdf' });

  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], text, title:`فاتورة ${inv.invoice_number}` });
      return;
    }catch(e){ /* user cancelled or failed, fall through */ }
  }
  // fallback: download PDF then open whatsapp chat with text
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`invoice-${inv.invoice_number}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);

  let phone = inv.customer?.whatsapp || inv.customer?.phone || '';
  phone = phone.replace(/[^0-9]/g,'');
  if(phone && phone.startsWith('0')) phone = '966'+phone.slice(1);
  const waUrl = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}`
    : `https://wa.me/?text=${encodeURIComponent(text)}`;
  showToast("جاري تحميل الفاتورة، افتح واتساب وأرفقها");
  setTimeout(()=>window.open(waUrl, '_blank'), 800);
}

/* ============ لوحة التحكم ============ */
function computeDashboard(){
  const today = new Date().toISOString().slice(0,10);
  const invoicesToday = state.invoices.filter(i=>i.created_at.slice(0,10)===today);
  const salesToday = invoicesToday.reduce((s,i)=>s+parseFloat(i.total),0);
  const thisMonth = new Date().toISOString().slice(0,7);
  const invoicesMonth = state.invoices.filter(i=>i.created_at.slice(0,7)===thisMonth);
  const salesMonth = invoicesMonth.reduce((s,i)=>s+parseFloat(i.total),0);

  const days = [...Array(7)].map((_,idx)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-idx));
    return d.toISOString().slice(0,10);
  });
  const dailyTotals = days.map(day => state.invoices.filter(i=>i.created_at.slice(0,10)===day).reduce((s,i)=>s+parseFloat(i.total),0));

  return { salesToday, countToday: invoicesToday.length, salesMonth, countMonth: invoicesMonth.length, days, dailyTotals, customersCount: state.customers.length };
}

  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.modal=null;state.editItem=null;render();}">
    <div class="modal-sheet">
      <div class="modal-title"><span>${c.id?'تعديل عميل':'إضافة عميل'}</span><button onclick="state.modal=null;state.editItem=null;render()">${ICONS.x}</button></div>
      <div class="field"><label>الاسم *</label><input id="cu-name" value="${c.name||''}"></div>
      <div class="field"><label>واتساب</label><input id="cu-wa" value="${c.whatsapp||''}" placeholder="05xxxxxxxx"></div>
      <div class="field"><label>جوال آخر</label><input id="cu-phone" value="${c.phone||''}"></div>
      <div class="field"><label>البريد الإلكتروني</label><input id="cu-email" value="${c.email||''}"></div>
      <div class="field"><label>العنوان</label><input id="cu-address" value="${c.address||''}"></div>
      <button class="btn btn-primary btn-block" onclick="submitCustomerForm()">حفظ</button>
    </div>
  </div>`;
}
function submitCustomerForm(){
  const name = document.getElementById('cu-name').value.trim();
  if(!name){ showToast("اسم العميل مطلوب"); return; }
  saveCustomer({
    name,
    whatsapp: document.getElementById('cu-wa').value.trim(),
    phone: document.getElementById('cu-phone').value.trim(),
    email: document.getElementById('cu-email').value.trim(),
    address: document.getElementById('cu-address').value.trim(),
  });
}

function renderProductsPage(){
  return `
  <div class="topbar">
    <button onclick="state.view='pos';render()">${ICONS.back}</button>
    <h1>المنتجات</h1>
    <button class="btn btn-primary btn-sm" onclick="state.editItem=null;openModal('add_product')">${ICONS.plus}</button>
  </div>
  <div class="page">
    ${state.products.length===0 ? `<div class="empty">${ICONS.box}<p style="margin-top:8px;">ما أضفت منتجات بعد</p></div>` : `
    <div class="card">
      ${state.products.map(p=>`
        <div class="list-row">
          <div>
            <div style="font-weight:500;font-size:13.5px;">${p.name}</div>
            <div class="muted" style="font-size:11.5px;">${money(p.price)} ر.س / ${p.unit||'قطعة'}</div>
          </div>
          <div style="display:flex;gap:14px;">
            <button onclick='state.editItem=${JSON.stringify(p).replace(/'/g,"&apos;")};openModal("add_product")'>${ICONS.edit}</button>
            <button onclick="deleteProduct('${p.id}')" style="color:var(--danger);">${ICONS.trash}</button>
          </div>
        </div>
      `).join('')}
    </div>`}
  </div>`;
}

function renderProductModal(){
  const p = state.editItem || {};
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.modal=null;state.editItem=null;render();}">
    <div class="modal-sheet">
      <div class="modal-title"><span>${p.id?'تعديل منتج':'إضافة منتج'}</span><button onclick="state.modal=null;state.editItem=null;render()">${ICONS.x}</button></div>
      <div class="field"><label>اسم المنتج / السلعة *</label><input id="pr-name" value="${p.name||''}"></div>
      <div class="field"><label>السعر (ر.س) *</label><input id="pr-price" type="number" value="${p.price||''}"></div>
      <div class="field"><label>الوحدة</label><input id="pr-unit" value="${p.unit||'قطعة'}"></div>
      <div class="field"><label>وصف (اختياري)</label><textarea id="pr-desc" rows="2">${p.description||''}</textarea></div>
      <button class="btn btn-primary btn-block" onclick="submitProductForm()">حفظ</button>
    </div>
  </div>`;
}
function submitProductForm(){
  const name = document.getElementById('pr-name').value.trim();
  const price = document.getElementById('pr-price').value;
  if(!name || !price){ showToast("الاسم والسعر مطلوبين"); return; }
  saveProduct({
    name, price,
    unit: document.getElementById('pr-unit').value.trim() || 'قطعة',
    description: document.getElementById('pr-desc').value.trim(),
  });
}

function renderDashboard(){
  const d = computeDashboard();
  setTimeout(()=>drawChart(d), 0);
  return `
  <div class="topbar"><h1>لوحة التحكم</h1></div>
  <div class="page">
    <div class="grid2" style="margin-bottom:12px;">
      <div class="stat-card"><div class="muted" style="font-size:12px;">مبيعات اليوم</div><div class="val">${money(d.salesToday)}</div></div>
      <div class="stat-card"><div class="muted" style="font-size:12px;">فواتير اليوم</div><div class="val">${d.countToday}</div></div>
      <div class="stat-card"><div class="muted" style="font-size:12px;">مبيعات الشهر</div><div class="val">${money(d.salesMonth)}</div></div>
      <div class="stat-card"><div class="muted" style="font-size:12px;">عدد العملاء</div><div class="val">${d.customersCount}</div></div>
    </div>
    <div class="card">
      <p style="font-weight:700;font-size:14px;margin-bottom:10px;">المبيعات آخر 7 أيام</p>
      <canvas id="salesChart" height="180"></canvas>
    </div>
  </div>`;
}
let chartInstance = null;
function drawChart(d){
  const canvas = document.getElementById('salesChart');
  if(!canvas) return;
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(canvas, {
    type:'bar',
    data:{
      labels: d.days.map(x=>x.slice(5)),
      datasets:[{ data: d.dailyTotals, backgroundColor:'#4F46E5', borderRadius:6 }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:true} }
    }
  });
}

function renderMoreSheet(){
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.navMoreOpen=false;render();}">
    <div class="modal-sheet" style="padding-bottom:24px;">
      <div class="modal-title"><span>المزيد</span><button onclick="state.navMoreOpen=false;render()">${ICONS.x}</button></div>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='customers_page';render()">${ICONS.user} العملاء</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='products_page';render()">${ICONS.box} المنتجات</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='setup_company';render()">${ICONS.settings} بيانات المنشأة</button>
      <button class="btn btn-outline btn-block" style="color:var(--danger);justify-content:flex-start;" onclick="handleLogout()">${ICONS.logout} تسجيل الخروج</button>
    </div>
  </div>`;
}

function openModal(name){ state.modal = name; render(); }

function renderBottomNav(){
  if(['auth','setup_company','loading'].includes(state.view)) return '';
  const items = [
    {id:'pos', label:'البيع', icon:ICONS.home},
    {id:'invoices_page', label:'الفواتير', icon:ICONS.list},
    {id:'dashboard', label:'التحكم', icon:ICONS.chart},
    {id:'more', label:'المزيد', icon:ICONS.more},
  ];
  return `<div class="bottomnav">
    ${items.map(it=>`
      <button class="navitem ${state.view===it.id?'active':''}" onclick="${it.id==='more'?'state.navMoreOpen=true;render()':`state.view='${it.id}';render()`}">
        ${it.icon}<span>${it.label}</span>
      </button>
    `).join('')}
  </div>`;
}

/* ============ التوجيه الرئيسي ============ */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.view){
    case 'loading': html = `<div style="min-height:100vh;" class="center"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div></div>`; break;
    case 'auth': html = renderAuth(); break;
    case 'setup_company': html = renderSetupCompany(); break;
    case 'pos': html = renderPOS(); break;
    case 'invoice_view': html = renderInvoiceView(); break;
    case 'invoices_page': html = renderInvoicesPage(); break;
    case 'customers_page': html = renderCustomersPage(); break;
    case 'products_page': html = renderProductsPage(); break;
    case 'dashboard': html = renderDashboard(); break;
    default: html = renderPOS();
  }
  html += renderBottomNav();
  if(state.modal==='checkout') html += renderCheckoutModal();
  if(state.modal==='add_customer') html += renderCustomerModal();
  if(state.modal==='add_product') html += renderProductModal();
  if(state.modal==='print_choice') html += renderPrintChoiceModal();
  if(state.navMoreOpen) html += renderMoreSheet();
  if(state.toastMsg) html += `<div class="toast">${state.toastMsg}</div>`;
  app.innerHTML = html;
}

initApp();
</script>
</body>
</html>
