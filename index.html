<style>
:root{
  --primary:#4F46E5;
  --primary-dark:#3730A3;
  --primary-light:#EEF0FF;
  --bg:#F4F5FA;
  --card:#FFFFFF;
  --text:#1F2333;
  --text-2:#6B7280;
  --border:#E7E8F0;
  --success:#16A34A;
  --success-bg:#DCFCE7;
  --danger:#DC2626;
  --danger-bg:#FEE2E2;
  --warn:#D97706;
  --warn-bg:#FEF3C7;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);direction:rtl;-webkit-font-smoothing:antialiased;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:76px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
input:disabled{opacity:.6;}
label{font-size:12.5px;color:var(--text-2);display:block;margin-bottom:6px;font-weight:500;}
.field{margin-bottom:14px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-size:14.5px;font-weight:700;transition:.15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-primary:disabled{opacity:.6;}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:active{background:var(--bg);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
.link-btn{color:var(--primary);font-size:12.5px;font-weight:500;text-decoration:underline;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.topbar h1{font-size:19px;font-weight:700;}
.page{padding:0 18px 24px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.icon{width:20px;height:20px;flex-shrink:0;}
.icon-sm{width:16px;height:16px;flex-shrink:0;}
.center{display:flex;align-items:center;justify-content:center;}
.between{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--text-2);}
.hidden{display:none !important;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 28px;max-height:88vh;overflow-y:auto;animation:slideup .2s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:30;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--text-2);font-size:10.5px;font-weight:500;}
.navitem.active{color:var(--primary);}
.prod-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center;position:relative;}
.prod-card:active{background:var(--primary-light);border-color:var(--primary);}
.cart-fab{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:484px;background:var(--primary);color:#fff;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:25;box-shadow:0 8px 20px rgba(79,70,229,.35);}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;}
.stat-card .val{font-size:21px;font-weight:700;margin-top:2px;}
.tabbar{display:flex;background:var(--primary-light);border-radius:11px;padding:4px;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--primary);}
.tab.active{background:#fff;}
.err-text{color:var(--danger);font-size:12.5px;margin-top:5px;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1F2333;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;z-index:200;max-width:90%;text-align:center;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
.spinner-dark{border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:50px 20px;color:var(--text-2);}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;}
.logo-upload{width:76px;height:76px;border-radius:16px;background:var(--primary-light);border:1.5px dashed var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--primary);}
.logo-upload img{width:100%;height:100%;object-fit:cover;}
.day-header{font-size:12.5px;font-weight:700;color:var(--text-2);margin:18px 0 8px;padding:0 2px;}
.day-header:first-child{margin-top:0;}
.contact-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.tpl-card{border:2px solid var(--border);border-radius:12px;padding:10px;text-align:center;cursor:pointer;}
.tpl-card.active{border-color:var(--primary);background:var(--primary-light);}
#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;top:0;left:0;width:80mm;padding:2mm;font-size:11px;}
  #print-area.w58{width:58mm;font-size:9.5px;}
}
</style>

/* ============ تحميل بيانات المستخدم ============ */
function postLoginView(){
  if(!state.company) return "setup_company";
  if((state.staffProfiles && state.staffProfiles.length>0) || state.company.admin_pin){
    return "select_profile";
  }
  state.activeProfile = { role:'admin' };
  return "pos";
}

async function loadAllData(){
  const uid = state.user.id;
  const [company, customers, products, invoices, staff] = await Promise.all([
    sb.from('company_settings').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('customers').select('*').eq('user_id', uid).order('created_at',{ascending:false}),
    sb.from('products').select('*').eq('user_id', uid).order('created_at',{ascending:false}),
    sb.from('invoices').select('*, customers(name)').eq('user_id', uid).order('created_at',{ascending:false}).limit(300),
    sb.from('staff_profiles').select('*').eq('user_id', uid).order('created_at',{ascending:false})
  ]);
  if(company.error || customers.error || products.error || invoices.error){
    throw new Error('تعذّر الاتصال بقاعدة البيانات');
  }
  state.company = company.data || null;
  state.customers = customers.data || [];
  state.products = products.data || [];
  state.invoices = invoices.data || [];
  state.staffProfiles = staff.data || [];
}

async function initApp(){
  // لو الرابط رابط فاتورة مختصر (?i=code)، نعرض الفاتورة كصفحة مباشرة (نص عربي مثالي، بدون تحويل PDF)
  const shortCode = new URLSearchParams(window.location.search).get('i');
  if(shortCode){
    document.getElementById('app').innerHTML = `<div style="min-height:100vh;" class="center"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div></div>`;
    const { data, error } = await sb.from('invoice_links').select('invoice_data').eq('code', shortCode).maybeSingle();
    if(!error && data && data.invoice_data){
      const inv = data.invoice_data.invoice;
      const c = data.invoice_data.company;
      document.getElementById('app').innerHTML = `
        <div style="padding:16px;">
          <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px;">${invoiceReceiptHTML(inv, c)}</div>
          <button class="btn btn-primary btn-block" onclick="printSharedInvoice()">${ICONS.print} طباعة / حفظ كملف PDF</button>
        </div>`;
      renderQrInto(`qr-holder-${inv.id}`, inv, c, document.getElementById('app'));
      window._sharedInvoiceForPrint = { inv, c };
    } else {
      document.getElementById('app').innerHTML = `<div style="min-height:100vh;padding:24px;text-align:center;" class="center"><p>الرابط غير صالح أو منتهي</p></div>`;
    }
    return;
  }
  if(window.location.hash.includes('type=recovery')){
    state.view = "reset_password";
    render();
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.user = session.user;
    try{
      await loadAllData();
      state.view = postLoginView();
      trySyncOfflineQueue();
    }catch(e){
      state.view = "connection_error";
    }
  } else {
    state.view = "auth";
  }
  render();
}

sb.auth.onAuthStateChange((event, session) => {
  if(event === "PASSWORD_RECOVERY"){
    state.view = "reset_password";
    render();
  }
  if(event === "SIGNED_OUT"){
    state.user = null; state.company=null; state.customers=[]; state.products=[]; state.invoices=[];
    state.staffProfiles=[]; state.activeProfile=null;
    state.view = "auth"; render();
  }
});

/* ============ المصادقة ============ */
async function handleAuthSubmit(email, password){
  state.authError = ""; state.authLoading = true; render();
  try{
    if(state.authMode === "signup"){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session){
        state.user = data.user;
        await loadAllData();
        state.view = "setup_company";
      } else {
        state.authLoading = false;
        showToast("تم إنشاء الحساب بنجاح. يرجى مراجعة بريدك الإلكتروني لتأكيد الحساب ثم تسجيل الدخول");
        state.authMode = "login";
        render();
        return;
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      state.user = data.user;
      await loadAllData();
      state.view = postLoginView();
      trySyncOfflineQueue();
    }
  }catch(e){
    state.authError = e.message.includes("Invalid login") ? "البريد أو كلمة المرور غير صحيحة" :
                       e.message.includes("confirm") ? "يجب تأكيد البريد الإلكتروني أولاً (يرجى مراجعة بريدك)" :
                       e.message;
  }
  state.authLoading = false;
  render();
}
async function handleForgotPassword(email){
  if(!email){ showToast("يرجى إدخال البريد الإلكتروني أولاً"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if(error){ showToast("خطأ: "+error.message); return; }
  showToast("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني");
  state.forgotMode = false;
  render();
}
async function handleSetNewPassword(pass, pass2){
  if(!pass || pass.length<6){ showToast("يجب أن تتكون كلمة المرور من 6 أحرف على الأقل"); return; }
  if(pass!==pass2){ showToast("كلمتا المرور غير متطابقتين"); return; }
  const { error } = await sb.auth.updateUser({ password: pass });
  if(error){ showToast("خطأ: "+error.message); return; }
  showToast("تم تحديث كلمة المرور بنجاح، يرجى تسجيل الدخول الآن");
  window.location.hash = "";
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.user = session.user;
    await loadAllData();
    state.view = postLoginView();
      trySyncOfflineQueue();
  } else {
    state.view = "auth";
  }
  render();
}
async function handleLogout(){ await sb.auth.signOut(); }

/* ============ حفظ بيانات المنشأة ============ */
let pendingLogoFile = null;
function handleLogoPreview(e){
  const file = e.target.files[0]; if(!file) return;
  pendingLogoFile = file;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById('logo-preview').innerHTML = `<img src="${ev.target.result}">`; };
  reader.readAsDataURL(file);
}
function addContactRow(){ state.contactDraft.push({type:'whatsapp', value:''}); render(); }
function removeContactRow(idx){ state.contactDraft.splice(idx,1); render(); }
function updateContactRow(idx, field, val){ state.contactDraft[idx][field] = val; }

async function saveCompany(form, logoFile){
  let logo_url = state.company?.logo_url || null;
  if(logoFile){
    const path = `${state.user.id}/logo.png`;
    const { error: upErr } = await sb.storage.from('logos').upload(path, logoFile, { upsert:true, contentType: logoFile.type });
    if(!upErr){
      const { data } = sb.storage.from('logos').getPublicUrl(path);
      logo_url = data.publicUrl + "?t=" + Date.now();
    }
  }
  const contact_accounts = state.contactDraft.filter(c=>c.value && c.value.trim());
  const payload = { ...form, logo_url, contact_accounts, user_id: state.user.id, updated_at: new Date().toISOString() };
  let res;
  if(state.company){
    res = await sb.from('company_settings').update(payload).eq('id', state.company.id).select().single();
  } else {
    res = await sb.from('company_settings').insert(payload).select().single();
  }
  if(res.error){ showToast("حدث خطأ: " + res.error.message); return; }
  state.company = res.data;
  showToast("تم الحفظ بنجاح");
  state.view = "pos";
  render();
}

/* ============ عملاء ============ */
async function saveCustomer(form){
  const payload = { ...form, user_id: state.user.id };
  let res;
  if(state.editItem){
    res = await sb.from('customers').update(payload).eq('id', state.editItem.id).select().single();
  } else {
    res = await sb.from('customers').insert(payload).select().single();
  }
  if(res.error){ showToast("خطأ: " + res.error.message); return; }
  if(state.editItem) state.customers = state.customers.map(c=>c.id===res.data.id?res.data:c);
  else state.customers = [res.data, ...state.customers];
  state.modal = null; state.editItem = null;
  showToast("تم حفظ بيانات العميل بنجاح");
  render();
}
async function deleteCustomer(id){
  await sb.from('customers').delete().eq('id', id);
  state.customers = state.customers.filter(c=>c.id!==id);
  render();
}

/* ============ منتجات ============ */
async function saveProduct(form){
  const payload = { ...form, price: parseFloat(form.price)||0, user_id: state.user.id };
  let res;
  if(state.editItem){
    res = await sb.from('products').update(payload).eq('id', state.editItem.id).select().single();
  } else {
    res = await sb.from('products').insert(payload).select().single();
  }
  if(res.error){ showToast("خطأ: " + res.error.message); return; }
  if(state.editItem) state.products = state.products.map(p=>p.id===res.data.id?res.data:p);
  else state.products = [res.data, ...state.products];
  state.modal = null; state.editItem = null; state.pendingBarcode = '';
  showToast("تم حفظ بيانات المنتج بنجاح");
  render();
}
async function deleteProduct(id){
  await sb.from('products').delete().eq('id', id);
  state.products = state.products.filter(p=>p.id!==id);
  render();
}

/* ============ قارئ الباركود ============ */
function openBarcodeScanner(context){
  state.scanContext = context;
  state.modalBeforeScan = state.modal;
  state.modal = 'barcode_scan';
  render();
  setTimeout(startBarcodeScanner, 200);
}
function startBarcodeScanner(){
  if(typeof Html5Qrcode === 'undefined'){
    showToast("تعذّر تحميل مكتبة الكاميرا، تحقق من الاتصال بالإنترنت");
    return;
  }
  const el = document.getElementById('qr-reader');
  if(!el) return;
  const scanner = new Html5Qrcode("qr-reader");
  window._barcodeScanner = scanner;
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 160 } },
    (decodedText) => onBarcodeScanned(decodedText),
    () => {}
  ).catch(err=>{
    console.error('camera start error:', err);
    showToast("تعذّر تشغيل الكاميرا، تأكد من إعطاء إذن الوصول لها");
  });
}
function stopBarcodeScanner(){
  const scanner = window._barcodeScanner;
  if(scanner){
    scanner.stop().then(()=>scanner.clear()).catch(()=>{});
    window._barcodeScanner = null;
  }
}
function closeBarcodeScanner(restorePrevious){
  stopBarcodeScanner();
  state.modal = restorePrevious ? state.modalBeforeScan : null;
  render();
}
function onBarcodeScanned(text){
  stopBarcodeScanner();
  if(state.scanContext === 'product'){
    state.pendingBarcode = text;
    state.modal = state.modalBeforeScan || 'add_product';
    render();
    showToast("تم قراءة الباركود");
  } else if(state.scanContext === 'pos'){
    state.modal = null;
    const product = state.products.find(p => p.barcode && p.barcode === text);
    if(product){
      addProductToCart(product);
      showToast("تمت إضافة \""+product.name+"\" للسلة");
    } else {
      render();
      if(confirm("هذا الباركود غير مسجل بمنتجاتك. هل تريد إضافته كمنتج جديد؟")){
        state.editItem = null;
        state.pendingBarcode = text;
        openModal('add_product');
      } else {
        state.pendingBarcode = "";
      }
    }
  }
}

function addProductToCart(product){
  const existing = state.cart.find(i=>i.product_id===product.id);
  if(existing){ existing.quantity += 1; existing.line_total = existing.quantity*existing.unit_price; }
  else state.cart.push({ product_id: product.id, description: product.name, quantity:1, unit_price: product.price, line_total: product.price });
  render();
}
function changeQty(idx, delta){
  const item = state.cart[idx];
  item.quantity = Math.max(1, item.quantity + delta);
  item.line_total = item.quantity * item.unit_price;
  render();
}
function removeCartItem(idx){ state.cart.splice(idx,1); render(); }
function addManualItem(desc, price){
  if(!desc || !price || isNaN(parseFloat(price))) return;
  state.cart.push({ product_id:null, description:desc, quantity:1, unit_price: parseFloat(price), line_total: parseFloat(price) });
  render();
}
function cartSubtotal(){ return state.cart.reduce((s,i)=>s+i.line_total,0); }
function computeDiscountAmount(subtotal){
  const val = parseFloat(state.checkout.discount)||0;
  if(state.checkout.discountType === 'percent'){
    return Math.max(0, Math.round(subtotal * (val/100) * 100)/100);
  }
  return Math.max(0, val);
}

/* ============ العمل بدون إنترنت (قائمة انتظار محلية) ============ */
const OFFLINE_QUEUE_KEY = 'offline_invoices_queue';
function getOfflineQueue(){
  try{ return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)||'[]'); }catch(e){ return []; }
}
function setOfflineQueue(queue){
  try{ localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(queue)); }catch(e){}
}
function saveOfflineInvoice(invoicePayload, items, customerLocalData){
  const queue = getOfflineQueue();
  const tempNumber = 'مؤقت-' + (queue.filter(q=>!q.synced).length + 1);
  const record = {
    tempId: 'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
    tempNumber, invoicePayload, items, customerLocalData,
    created_at: new Date().toISOString(),
    synced: false
  };
  queue.push(record);
  setOfflineQueue(queue);
  return record;
}
function offlineQueueToInvoiceShape(rec){
  const customer = rec.customerLocalData
    ? { name: rec.customerLocalData.name, phone: rec.customerLocalData.phone, whatsapp: rec.customerLocalData.whatsapp }
    : (rec.invoicePayload.customer_id ? state.customers.find(c=>c.id===rec.invoicePayload.customer_id) : null);
  return {
    id: rec.tempId,
    invoice_number: rec.tempNumber,
    created_at: rec.created_at,
    subtotal: rec.invoicePayload.subtotal,
    discount: rec.invoicePayload.discount,
    tax: rec.invoicePayload.tax,
    total: rec.invoicePayload.total,
    status: rec.invoicePayload.status,
    payment_method: rec.invoicePayload.payment_method,
    items: rec.items,
    customer: customer || null,
    _offlinePending: true
  };
}
async function trySyncOfflineQueue(){
  if(!navigator.onLine || !state.user) return;
  const queue = getOfflineQueue();
  const pending = queue.filter(q=>!q.synced);
  if(pending.length===0) return;
  let syncedCount = 0;
  for(const rec of pending){
    try{
      let customerId = rec.invoicePayload.customer_id;
      if(!customerId && rec.customerLocalData){
        const { data:newCu, error:cuErr } = await sb.from('customers').insert({ ...rec.customerLocalData, user_id: state.user.id }).select().single();
        if(cuErr) continue;
        customerId = newCu.id;
        state.customers = [newCu, ...state.customers];
      }
      const { data:numData, error:numErr } = await sb.rpc('generate_invoice_number', { p_user_id: state.user.id });
      if(numErr) continue;
      const finalPayload = { ...rec.invoicePayload, customer_id: customerId||null, invoice_number: numData, user_id: state.user.id };
      const { data:inv, error:invErr } = await sb.from('invoices').insert(finalPayload).select().single();
      if(invErr) continue;
      const itemsPayload = rec.items.map(i=>({ ...i, invoice_id: inv.id }));
      await sb.from('invoice_items').insert(itemsPayload);
      rec.synced = true;
      const customer = state.customers.find(c=>c.id===customerId);
      state.invoices = [{ ...inv, customers: customer?{name:customer.name}:null }, ...state.invoices];
      syncedCount++;
    }catch(e){ /* بيحاول تاني بعدين */ }
  }
  const stillPendingIds = pending.filter(p=>!p.synced).map(p=>p.tempId);
  setOfflineQueue(getOfflineQueue().filter(q=>stillPendingIds.includes(q.tempId)));
  if(syncedCount>0){ showToast(`تمت مزامنة ${syncedCount} فاتورة معلّقة بنجاح`); render(); }
}
window.addEventListener('online', ()=>trySyncOfflineQueue());
setInterval(()=>trySyncOfflineQueue(), 30000);

async function confirmInvoice(){
  if(state.checkoutLoading) return;
  if(state.cart.length===0){ showToast("السلة فارغة، يرجى إضافة صنف أو بند يدوي أولاً"); return; }

  // نقرأ بيانات العميل الجديد (لو موجودة) من الحالة الداخلية (تبقى محفوظة رغم إعادة الرسم)
  const qName = (state.checkout.quickName||'').trim();
  const qWa = (state.checkout.quickWa||'').trim();

  state.checkoutLoading = true; render();

  const subtotal = cartSubtotal();
  const discount = computeDiscountAmount(subtotal);
  const total = Math.max(0, Math.round((subtotal - discount)*100)/100);
  const tax = 0;
  const items = state.cart.map(i=>({
    product_id: i.product_id, description: i.description,
    quantity: i.quantity, unit_price: i.unit_price, line_total: i.line_total
  }));

  function resetCheckoutState(){
    state.cart = [];
    state.checkout = { customerId:"", payment:"cash", discount:0, discountType:"fixed", status:"paid", quickName:"", quickWa:"", manDesc:"", manPrice:"" };
    state.customerSearchQuery = "";
    state.modal = null;
    state.viewingHistorical = false;
    state.view = "invoice_view";
  }
  function goOffline(customerId, customerLocalData, message){
    const invoicePayload = { customer_id: customerId||null, subtotal, discount, tax, total, status: state.checkout.status, payment_method: state.checkout.payment };
    const rec = saveOfflineInvoice(invoicePayload, items, customerLocalData);
    state.lastInvoice = offlineQueueToInvoiceShape(rec);
    resetCheckoutState();
    showToast(message);
  }

  try{
    let customerId = state.checkout.customerId || null;
    let customerLocalData = null;
    const isOffline = !navigator.onLine;

    if(!customerId && qName){
      let existingCu = null;
      if(qWa){
        const qWaDigits = qWa.replace(/[^0-9]/g,'');
        existingCu = state.customers.find(c=>{
          const cDigits = (c.whatsapp||c.phone||'').replace(/[^0-9]/g,'');
          return cDigits && qWaDigits && cDigits.slice(-9) === qWaDigits.slice(-9);
        });
      }
      if(existingCu){
        customerId = existingCu.id;
        showToast(`هذا الرقم مسجل مسبقاً باسم "${existingCu.name}"، تم ربط الفاتورة به`);
      } else if(isOffline){
        customerLocalData = { name: qName, whatsapp: qWa||null, phone: qWa||null };
      } else {
        const { data: newCu, error: cuErr } = await sb.from('customers').insert({ name: qName, whatsapp: qWa||null, phone: qWa||null, user_id: state.user.id }).select().single();
        if(!cuErr && newCu){
          state.customers = [newCu, ...state.customers];
          customerId = newCu.id;
        } else if(cuErr){
          customerLocalData = { name: qName, whatsapp: qWa||null, phone: qWa||null };
        }
      }
    }

    if(isOffline){
      goOffline(customerId, customerLocalData, "لا يوجد اتصال بالإنترنت، تم حفظ الفاتورة مؤقتاً وستتم مزامنتها تلقائياً عند رجوع الاتصال");
      return;
    }

    const { data: numData, error: numErr } = await sb.rpc('generate_invoice_number', { p_user_id: state.user.id });
    if(numErr){
      goOffline(customerId, customerLocalData, "تعذّر الاتصال بالسيرفر، تم حفظ الفاتورة مؤقتاً وستتم مزامنتها لاحقاً");
      return;
    }

    const invoicePayload = {
      user_id: state.user.id,
      invoice_number: numData,
      customer_id: customerId,
      subtotal, discount, tax, total,
      status: state.checkout.status,
      payment_method: state.checkout.payment,
    };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invoicePayload).select().single();
    if(invErr){
      goOffline(customerId, customerLocalData, "تعذّر الاتصال بالسيرفر، تم حفظ الفاتورة مؤقتاً وستتم مزامنتها لاحقاً");
      return;
    }

    const itemsWithInvoiceId = items.map(i=>({ ...i, invoice_id: inv.id }));
    await sb.from('invoice_items').insert(itemsWithInvoiceId);

    const customer = state.customers.find(c=>c.id===customerId);
    state.lastInvoice = { ...inv, items, customer: customer||null };
    state.invoices = [{...inv, customers: customer?{name:customer.name}:null}, ...state.invoices];
    resetCheckoutState();
  } finally {
    state.checkoutLoading = false;
    render();
  }
}

/* ============ لوحة التحكم ============ */
function dashDateRange(){
  const today = new Date();
  let from, to;
  if(state.dashRange==='today'){ from = isoDay(today); to = isoDay(today); }
  else if(state.dashRange==='week'){ const d=new Date(today); d.setDate(d.getDate()-6); from=isoDay(d); to=isoDay(today); }
  else if(state.dashRange==='month'){ const d=new Date(today); d.setDate(d.getDate()-29); from=isoDay(d); to=isoDay(today); }
  else { from = state.dashFrom || isoDay(today); to = state.dashTo || isoDay(today); }
  return {from, to};
}
function computeDashboard(){
  const {from, to} = dashDateRange();
  const inRange = state.invoices.filter(i=>{ const d=isoDay(i.created_at); return d>=from && d<=to && i.status!=='cancelled'; });
  const totalSales = inRange.reduce((s,i)=>s+parseFloat(i.total),0);
  const collected = inRange.filter(i=>i.status==='paid').reduce((s,i)=>s+parseFloat(i.total),0);
  const receivable = inRange.filter(i=>i.status==='unpaid').reduce((s,i)=>s+parseFloat(i.total),0);

  const dayList = [];
  let cur = new Date(from);
  const end = new Date(to);
  while(cur<=end && dayList.length<60){ dayList.push(isoDay(cur)); cur.setDate(cur.getDate()+1); }
  const dailyTotals = dayList.map(day => inRange.filter(i=>isoDay(i.created_at)===day).reduce((s,i)=>s+parseFloat(i.total),0));

  const today = isoDay(new Date());
  const todayInvoices = state.invoices.filter(i=>isoDay(i.created_at)===today && i.status!=='cancelled');
  const byPayment = {cash:0, card:0, transfer:0};
  todayInvoices.forEach(i=>{ byPayment[i.payment_method] = (byPayment[i.payment_method]||0) + parseFloat(i.total); });

  const unpaidAll = state.invoices.filter(i=>i.status==='unpaid');
  const unpaidTotal = unpaidAll.reduce((s,i)=>s+parseFloat(i.total),0);

  return { totalSales, collected, receivable, countInRange: inRange.length, dayList, dailyTotals, customersCount: state.customers.length,
           todaySales: todayInvoices.reduce((s,i)=>s+parseFloat(i.total),0), todayCount: todayInvoices.length, byPayment,
           unpaidAll, unpaidTotal, unpaidCount: unpaidAll.length };
}

function renderPinPrompt(){
  const isAdmin = state.pinAttemptProfile === 'admin';
  const p = isAdmin ? null : state.staffProfiles.find(x=>x.id===state.pinAttemptProfile);
  if(!isAdmin && !p) return '';
  const label = isAdmin ? 'رمز الأدمن' : `رمز ${p.name}`;
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.pinAttemptProfile=null;state.pinAttemptError='';render();}">
    <div class="modal-sheet">
      <div class="modal-title"><span>${label}</span><button onclick="state.pinAttemptProfile=null;state.pinAttemptError='';render()">${ICONS.x}</button></div>
      <div class="field"><label>أدخل الرمز</label><input id="pin-input" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;font-size:22px;letter-spacing:6px;"></div>
      ${state.pinAttemptError ? `<div class="err-text">${state.pinAttemptError}</div>` : ''}
      <button class="btn btn-primary btn-block" onclick="submitStaffPin('${state.pinAttemptProfile}')">دخول</button>
    </div>
  </div>`;
}
function promptAdminPin(){
  if(!state.company?.admin_pin){
    selectAdminProfile();
    return;
  }
  state.pinAttemptProfile = 'admin';
  state.pinAttemptError = "";
  render();
  setTimeout(()=>document.getElementById('pin-input')?.focus(), 100);
}
function promptStaffPin(profileId){
  state.pinAttemptProfile = profileId;
  state.pinAttemptError = "";
  render();
  setTimeout(()=>document.getElementById('pin-input')?.focus(), 100);
}
function submitStaffPin(profileId){
  const entered = document.getElementById('pin-input')?.value.trim();
  if(profileId === 'admin'){
    if(entered !== state.company?.admin_pin){
      state.pinAttemptError = "الرمز غير صحيح";
      render();
      setTimeout(()=>document.getElementById('pin-input')?.focus(), 100);
      return;
    }
    state.pinAttemptProfile = null;
    state.pinAttemptError = "";
    selectAdminProfile();
    return;
  }
  const p = state.staffProfiles.find(x=>x.id===profileId);
  if(!p || entered !== p.pin){
    state.pinAttemptError = "الرمز غير صحيح";
    render();
    setTimeout(()=>document.getElementById('pin-input')?.focus(), 100);
    return;
  }
  state.activeProfile = { role:'staff', name: p.name };
  state.pinAttemptProfile = null;
  state.pinAttemptError = "";
  state.view = 'pos';
  render();
}
function selectAdminProfile(){
  state.activeProfile = { role:'admin' };
  state.view = 'pos';
  render();
}
function switchProfile(){
  state.activeProfile = null;
  state.navMoreOpen = false;
  state.view = 'select_profile';
  render();
}

let selectedTemplate = null;
function selectTemplate(val){
  selectedTemplate = val;
  document.querySelectorAll('.tpl-card').forEach(el=>el.classList.remove('active'));
  document.getElementById('tpl-'+val).classList.add('active');
}
function submitCompanyForm(){
  const name = document.getElementById('c-name').value.trim();
  if(!name){ showToast("اسم المنشأة مطلوب"); return; }
  const adminPin = document.getElementById('c-admin-pin').value.trim();
  if(adminPin && !/^[0-9]{4,6}$/.test(adminPin)){ showToast("رمز الأدمن لازم يكون من 4 إلى 6 أرقام، أو اتركه فاضي"); return; }
  const form = {
    name,
    phone: document.getElementById('c-phone').value.trim(),
    whatsapp: document.getElementById('c-phone').value.trim(),
    address: document.getElementById('c-address').value.trim(),
    tax_number: document.getElementById('c-tax').value.trim(),
    commercial_register: document.getElementById('c-cr').value.trim(),
    invoice_template: selectedTemplate || state.company?.invoice_template || 'classic',
    admin_pin: adminPin || null,
  };
  saveCompany(form, pendingLogoFile);
  pendingLogoFile = null;
}

function groupInvoicesByDay(invoices){
  const today = isoDay(new Date());
  const yestD = new Date(); yestD.setDate(yestD.getDate()-1);
  const yesterday = isoDay(yestD);
  const groups = {};
  invoices.forEach(inv=>{
    const day = isoDay(inv.created_at);
    if(!groups[day]) groups[day] = [];
    groups[day].push(inv);
  });
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(day=>({
    key: day,
    label: day===today ? 'اليوم' : day===yesterday ? 'أمس' : fmtDate(day),
    invoices: groups[day],
    total: groups[day].reduce((s,i)=>s+parseFloat(i.total),0)
  }));
}
function toggleInvoiceDay(key){
  if(!state.invoiceDaysToggled) state.invoiceDaysToggled = new Set();
  if(state.invoiceDaysToggled.has(key)) state.invoiceDaysToggled.delete(key);
  else state.invoiceDaysToggled.add(key);
  render();
}
function invoicesRangeFilter(invoices){
  if(state.invoicesRange==='all') return invoices;
  const today = new Date();
  let from;
  if(state.invoicesRange==='today') from = isoDay(today);
  else if(state.invoicesRange==='week'){ const d=new Date(today); d.setDate(d.getDate()-6); from = isoDay(d); }
  else { const d=new Date(today); d.setDate(d.getDate()-29); from = isoDay(d); }
  return invoices.filter(i=>isoDay(i.created_at) >= from);
}

      <canvas id="salesChart" height="180"></canvas>
    </div>

    ${d.unpaidCount>0 ? `
    <div class="card" style="margin-bottom:14px;">
      <div class="between" style="margin-bottom:10px;">
        <p style="font-weight:700;font-size:14px;">الفواتير غير المدفوعة</p>
        <span class="pill" style="background:var(--warn-bg);color:var(--warn);">${d.unpaidCount} فاتورة</span>
      </div>
      <div class="between" style="margin-bottom:10px;"><span class="muted" style="font-size:13px;">إجمالي المستحقات</span><span style="font-weight:700;color:var(--warn);">${money(d.unpaidTotal)} ر.س</span></div>
      <div style="border-top:1px solid var(--border);padding-top:6px;">
        ${d.unpaidAll.slice(0,8).map(inv=>`
          <div class="list-row" style="cursor:pointer;" onclick="openInvoice('${inv.id}')">
            <div>
              <div style="font-weight:500;font-size:13px;">${inv.customers?.name || 'بدون عميل'}</div>
              <div class="muted" style="font-size:11px;">#${inv.invoice_number}</div>
            </div>
            <div style="font-weight:700;color:var(--warn);">${money(inv.total)} ر.س</div>
          </div>
        `).join('')}
        ${d.unpaidCount>8 ? `<p class="muted" style="font-size:11.5px;text-align:center;margin-top:8px;">و${d.unpaidCount-8} فاتورة أخرى غير مدفوعة</p>` : ''}
      </div>
    </div>` : ''}

    <div class="card" style="margin-bottom:14px;">
      <p style="font-weight:700;font-size:14px;margin-bottom:12px;">تقرير نهاية اليوم (إغلاق الصندوق)</p>
      <div class="between" style="margin-bottom:8px;"><span class="muted" style="font-size:13px;">إجمالي مبيعات اليوم</span><span style="font-weight:700;">${money(d.todaySales)} ر.س</span></div>
      <div class="between" style="margin-bottom:12px;"><span class="muted" style="font-size:13px;">عدد فواتير اليوم</span><span style="font-weight:700;">${d.todayCount}</span></div>
      <div style="border-top:1px solid var(--border);padding-top:10px;margin-bottom:14px;">
        <div class="between" style="font-size:13px;padding:4px 0;"><span>نقدي</span><span>${money(d.byPayment.cash||0)}</span></div>
        <div class="between" style="font-size:13px;padding:4px 0;"><span>شبكة</span><span>${money(d.byPayment.card||0)}</span></div>
        <div class="between" style="font-size:13px;padding:4px 0;"><span>تحويل</span><span>${money(d.byPayment.transfer||0)}</span></div>
      </div>
      <button class="btn btn-outline btn-block" onclick="printDailyBrief()">${ICONS.print} طباعة الملخص</button>
    </div>
  </div>`;
}
function printDailyBrief(){
  const d = computeDashboard();
  const c = state.company;
  const area = document.getElementById('print-area');
  area.className = '';
  area.innerHTML = `
    <div dir="rtl" style="font-family:'Tajawal',sans-serif;padding:14px;">
      <div style="text-align:center;margin-bottom:12px;">
        <div style="font-weight:700;font-size:15px;">${c?.name||''}</div>
        <div style="font-size:12px;color:#6B7280;">تقرير نهاية اليوم</div>
        <div style="font-size:11px;color:#6B7280;">${new Date().toLocaleDateString('ar-SA')}</div>
      </div>
      <div style="border-top:1px dashed #999;border-bottom:1px dashed #999;padding:8px 0;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>إجمالي مبيعات اليوم</span><span>${money(d.todaySales)} ر.س</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>عدد الفواتير</span><span>${d.todayCount}</span></div>
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>نقدي</span><span>${money(d.byPayment.cash||0)} ر.س</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>شبكة</span><span>${money(d.byPayment.card||0)} ر.س</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>تحويل</span><span>${money(d.byPayment.transfer||0)} ر.س</span></div>
    </div>`;
  setTimeout(()=>window.print(), 150);
}
let chartInstance = null;
function drawChart(d){
  const canvas = document.getElementById('salesChart');
  if(!canvas) return;
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(canvas, {
    type:'bar',
    data:{ labels: d.dayList.map(x=>x.slice(5)), datasets:[{ data: d.dailyTotals, backgroundColor:'#4F46E5', borderRadius:6 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true} } }
  });
}

function renderMoreSheet(){
  if(isStaff()){
    return `
    <div class="modal-overlay" onclick="if(event.target===this){state.navMoreOpen=false;render();}">
      <div class="modal-sheet" style="padding-bottom:24px;">
        <div class="modal-title"><span>المزيد</span><button onclick="state.navMoreOpen=false;render()">${ICONS.x}</button></div>
        <button class="btn btn-outline btn-block" style="justify-content:flex-start;" onclick="state.navMoreOpen=false;switchProfile()">${ICONS.logout} تبديل المستخدم</button>
      </div>
    </div>`;
  }
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.navMoreOpen=false;render();}">
    <div class="modal-sheet" style="padding-bottom:24px;">
      <div class="modal-title"><span>المزيد</span><button onclick="state.navMoreOpen=false;render()">${ICONS.x}</button></div>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='customers_page';render()">${ICONS.user} العملاء</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='products_page';render()">${ICONS.box} المنتجات</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.contactDraft=[];state.view='setup_company';render()">${ICONS.settings} بيانات المنشأة</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='staff_management';render()">${ICONS.user} إدارة الموظفين</button>
      ${state.staffProfiles.length>0 ? `<button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;switchProfile()">${ICONS.logout} تبديل المستخدم</button>` : ''}
      <button class="btn btn-outline btn-block" style="color:var(--danger);justify-content:flex-start;" onclick="handleLogout()">${ICONS.logout} تسجيل الخروج</button>
    </div>
  </div>`;
}

function renderEditInvoiceModal(){
  const e = state.editInvoice;
  const total = Math.max(0, (parseFloat(e.subtotal)||0) - (parseFloat(e.discount)||0));
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.modal=null;state.editInvoice=null;render();}">
    <div class="modal-sheet">
      <div class="modal-title"><span>تعديل فاتورة #${e.invoice_number}</span><button onclick="state.modal=null;state.editInvoice=null;render()">${ICONS.x}</button></div>

      <div class="field">
        <label>العميل</label>
        <select onchange="state.editInvoice.customer_id=this.value">
          <option value="">اختر العميل</option>
          ${state.customers.map(c=>`<option value="${c.id}" ${e.customer_id===c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </div>

      <div class="field"><label>الخصم (ر.س)</label><input type="number" value="${e.discount}" oninput="state.editInvoice.discount=this.value;refreshEditTotal();"></div>

      <label style="margin-bottom:8px;">طريقة الدفع</label>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        ${['cash','card','transfer'].map(m=>`
          <button class="btn ${e.payment_method===m?'btn-primary':'btn-outline'}" style="flex-direction:column;padding:10px 4px;font-size:12px;" onclick="state.editInvoice.payment_method='${m}';render()">
            ${m==='cash'?ICONS.cash:m==='card'?ICONS.card:ICONS.bank}${payLabel(m)}
          </button>
        `).join('')}
      </div>

      <label style="margin-bottom:8px;">الحالة</label>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
        ${['paid','unpaid','cancelled'].map(s=>`
          <button class="btn ${e.status===s?'btn-primary':'btn-outline'}" style="font-size:12px;padding:9px 4px;" onclick="state.editInvoice.status='${s}';render()">${statusLabel(s)}</button>
        `).join('')}
      </div>

      <div class="card" style="background:var(--bg);border:none;margin-bottom:16px;">
        <div class="between" style="font-size:13px;color:var(--text-2);"><span>المجموع الفرعي</span><span>${money(e.subtotal)}</span></div>
        <div class="between" style="font-size:18px;font-weight:700;margin-top:6px;"><span>الإجمالي</span><span id="edit-total" style="color:var(--primary);">${money(total)} ر.س</span></div>
      </div>

      <button class="btn btn-primary btn-block" onclick="submitEditInvoice()">حفظ التعديلات</button>
    </div>
  </div>`;
}
function refreshEditTotal(){
  const e = state.editInvoice;
  const total = Math.max(0, (parseFloat(e.subtotal)||0) - (parseFloat(e.discount)||0));
  document.getElementById('edit-total').textContent = money(total)+' ر.س';
}

function openModal(name){ state.modal = name; render(); }

function renderBottomNav(){
  if(['auth','setup_company','loading','reset_password','connection_error','select_profile'].includes(state.view)) return '';
  const items = isStaff() ? [
    {id:'pos', label:'البيع', icon:ICONS.home},
    {id:'staff_brief', label:'ملخص اليوم', icon:ICONS.chart},
    {id:'more', label:'المزيد', icon:ICONS.more},
  ] : [
    {id:'pos', label:'البيع', icon:ICONS.home},
    {id:'invoices_page', label:'الفواتير', icon:ICONS.list},
    {id:'dashboard', label:'التحكم', icon:ICONS.chart},
    {id:'more', label:'المزيد', icon:ICONS.more},
  ];
  return `<div class="bottomnav">
    ${items.map(it=>`
      <button class="navitem ${state.view===it.id?'active':''}" onclick="${it.id==='more'?'state.navMoreOpen=true;render()':`state.view='${it.id}';render()`}">
        ${it.icon}<span>${it.label}</span>
      </button>
    `).join('')}
  </div>`;
}

/* ============ التوجيه الرئيسي ============ */
function render(){
  // نحفظ الخانة النشطة حالياً (اللي تكتب فيها) ومكان المؤشر، عشان نرجعها بعد إعادة الرسم
  const activeEl = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(activeEl && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA') && activeEl.id){
    focusId = activeEl.id;
    selStart = activeEl.selectionStart;
    selEnd = activeEl.selectionEnd;
  }

  const app = document.getElementById('app');
  let html = '';
  switch(state.view){
    case 'loading': html = `<div style="min-height:100vh;" class="center"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div></div>`; break;
    case 'auth': html = renderAuth(); break;
    case 'reset_password': html = renderResetPassword(); break;
    case 'connection_error': html = renderConnectionError(); break;
    case 'select_profile': html = renderSelectProfile(); break;
    case 'staff_management': html = renderStaffManagement(); break;
    case 'staff_brief': html = renderStaffBrief(); break;
    case 'setup_company': html = renderSetupCompany(); break;
    case 'pos': html = renderPOS(); break;
    case 'invoice_view': html = renderInvoiceView(); break;
    case 'invoices_page': html = renderInvoicesPage(); break;
    case 'customers_page': html = renderCustomersPage(); break;
    case 'products_page': html = renderProductsPage(); break;
    case 'dashboard': html = renderDashboard(); break;
    default: html = renderPOS();
  }
  html += renderBottomNav();
  if(state.modal==='checkout') html += renderCheckoutModal();
  if(state.modal==='add_customer') html += renderCustomerModal();
  if(state.modal==='add_product') html += renderProductModal();
  if(state.modal==='edit_invoice') html += renderEditInvoiceModal();
  if(state.modal==='barcode_scan') html += renderBarcodeScanModal();
  if(state.navMoreOpen) html += renderMoreSheet();
  if(state.toastMsg) html += `<div class="toast">${state.toastMsg}</div>`;
  app.innerHTML = html;

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(typeof selStart === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed:', err));
  });
}

initApp();
</script>
</body>
</html>
