<style>
:root{
  --primary:#4F46E5;
  --primary-dark:#3730A3;
  --primary-light:#EEF0FF;
  --bg:#F4F5FA;
  --card:#FFFFFF;
  --text:#1F2333;
  --text-2:#6B7280;
  --border:#E7E8F0;
  --success:#16A34A;
  --success-bg:#DCFCE7;
  --danger:#DC2626;
  --danger-bg:#FEE2E2;
  --warn:#D97706;
  --warn-bg:#FEF3C7;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);direction:rtl;-webkit-font-smoothing:antialiased;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:76px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
input:disabled{opacity:.6;}
label{font-size:12.5px;color:var(--text-2);display:block;margin-bottom:6px;font-weight:500;}
.field{margin-bottom:14px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-size:14.5px;font-weight:700;transition:.15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-primary:disabled{opacity:.6;}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:active{background:var(--bg);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
.link-btn{color:var(--primary);font-size:12.5px;font-weight:500;text-decoration:underline;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.topbar h1{font-size:19px;font-weight:700;}
.page{padding:0 18px 24px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.icon{width:20px;height:20px;flex-shrink:0;}
.icon-sm{width:16px;height:16px;flex-shrink:0;}
.center{display:flex;align-items:center;justify-content:center;}
.between{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--text-2);}
.hidden{display:none !important;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 28px;max-height:88vh;overflow-y:auto;animation:slideup .2s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:30;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--text-2);font-size:10.5px;font-weight:500;}
.navitem.active{color:var(--primary);}
.prod-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center;position:relative;}
.prod-card:active{background:var(--primary-light);border-color:var(--primary);}
.cart-fab{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:484px;background:var(--primary);color:#fff;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:25;box-shadow:0 8px 20px rgba(79,70,229,.35);}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;}
.stat-card .val{font-size:21px;font-weight:700;margin-top:2px;}
.tabbar{display:flex;background:var(--primary-light);border-radius:11px;padding:4px;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--primary);}
.tab.active{background:#fff;}
.err-text{color:var(--danger);font-size:12.5px;margin-top:5px;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1F2333;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;z-index:200;max-width:90%;text-align:center;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
.spinner-dark{border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:50px 20px;color:var(--text-2);}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;}
.logo-upload{width:76px;height:76px;border-radius:16px;background:var(--primary-light);border:1.5px dashed var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--primary);}
.logo-upload img{width:100%;height:100%;object-fit:cover;}
.day-header{font-size:12.5px;font-weight:700;color:var(--text-2);margin:18px 0 8px;padding:0 2px;}
.day-header:first-child{margin-top:0;}
.contact-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.tpl-card{border:2px solid var(--border);border-radius:12px;padding:10px;text-align:center;cursor:pointer;}
.tpl-card.active{border-color:var(--primary);background:var(--primary-light);}
#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;top:0;left:0;width:80mm;padding:2mm;font-size:11px;}
  #print-area.w58{width:58mm;font-size:9.5px;}
}
</style>
</head>

/* ============ تحميل بيانات المستخدم ============ */
async function loadAllData(){
  const uid = state.user.id;
  const [company, customers, products, invoices] = await Promise.all([
    sb.from('company_settings').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('customers').select('*').eq('user_id', uid).order('created_at',{ascending:false}),
    sb.from('products').select('*').eq('user_id', uid).order('created_at',{ascending:false}),
    sb.from('invoices').select('*, customers(name)').eq('user_id', uid).order('created_at',{ascending:false}).limit(300)
  ]);
  state.company = company.data || null;
  state.customers = customers.data || [];
  state.products = products.data || [];
  state.invoices = invoices.data || [];
}

async function initApp(){
  if(window.location.hash.includes('type=recovery')){
    state.view = "reset_password";
    render();
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.user = session.user;
    await loadAllData();
    state.view = state.company ? "pos" : "setup_company";
  } else {
    state.view = "auth";
  }
  render();
}

sb.auth.onAuthStateChange((event, session) => {
  if(event === "PASSWORD_RECOVERY"){
    state.view = "reset_password";
    render();
  }
  if(event === "SIGNED_OUT"){
    state.user = null; state.company=null; state.customers=[]; state.products=[]; state.invoices=[];
    state.view = "auth"; render();
  }
});

/* ============ المصادقة ============ */
async function handleAuthSubmit(email, password){
  state.authError = ""; state.authLoading = true; render();
  try{
    if(state.authMode === "signup"){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      if(data.session){
        state.user = data.user;
        await loadAllData();
        state.view = "setup_company";
      } else {
        state.authLoading = false;
        showToast("تم إنشاء الحساب! تحقق من بريدك لتأكيد الحساب ثم سجل دخول");
        state.authMode = "login";
        render();
        return;
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      state.user = data.user;
      await loadAllData();
      state.view = state.company ? "pos" : "setup_company";
    }
  }catch(e){
    state.authError = e.message.includes("Invalid login") ? "البريد أو كلمة المرور غير صحيحة" :
                       e.message.includes("confirm") ? "لازم تأكد بريدك الإلكتروني أولاً (تحقق من الإيميل)" :
                       e.message;
  }
  state.authLoading = false;
  render();
}
async function handleForgotPassword(email){
  if(!email){ showToast("أدخل بريدك الإلكتروني أولاً"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if(error){ showToast("خطأ: "+error.message); return; }
  showToast("أرسلنا رابط إعادة تعيين كلمة المرور لبريدك");
  state.forgotMode = false;
  render();
}
async function handleSetNewPassword(pass, pass2){
  if(!pass || pass.length<6){ showToast("كلمة المرور لازم تكون 6 أحرف على الأقل"); return; }
  if(pass!==pass2){ showToast("كلمتا المرور غير متطابقتين"); return; }
  const { error } = await sb.auth.updateUser({ password: pass });
  if(error){ showToast("خطأ: "+error.message); return; }
  showToast("تم تحديث كلمة المرور، سجل دخول الآن");
  window.location.hash = "";
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){
    state.user = session.user;
    await loadAllData();
    state.view = state.company ? "pos" : "setup_company";
  } else {
    state.view = "auth";
  }
  render();
}
async function handleLogout(){ await sb.auth.signOut(); }

/* ============ حفظ بيانات المنشأة ============ */
let pendingLogoFile = null;
function handleLogoPreview(e){
  const file = e.target.files[0]; if(!file) return;
  pendingLogoFile = file;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById('logo-preview').innerHTML = `<img src="${ev.target.result}">`; };
  reader.readAsDataURL(file);
}
function addContactRow(){ state.contactDraft.push({type:'whatsapp', value:''}); render(); }
function removeContactRow(idx){ state.contactDraft.splice(idx,1); render(); }
function updateContactRow(idx, field, val){ state.contactDraft[idx][field] = val; }

async function saveCompany(form, logoFile){
  let logo_url = state.company?.logo_url || null;
  if(logoFile){
    const path = `${state.user.id}/logo.png`;
    const { error: upErr } = await sb.storage.from('logos').upload(path, logoFile, { upsert:true, contentType: logoFile.type });
    if(!upErr){
      const { data } = sb.storage.from('logos').getPublicUrl(path);
      logo_url = data.publicUrl + "?t=" + Date.now();
    }
  }
  const contact_accounts = state.contactDraft.filter(c=>c.value && c.value.trim());
  const payload = { ...form, logo_url, contact_accounts, user_id: state.user.id, updated_at: new Date().toISOString() };
  let res;
  if(state.company){
    res = await sb.from('company_settings').update(payload).eq('id', state.company.id).select().single();
  } else {
    res = await sb.from('company_settings').insert(payload).select().single();
  }
  if(res.error){ showToast("حصل خطأ: " + res.error.message); return; }
  state.company = res.data;
  showToast("تم الحفظ بنجاح");
  state.view = "pos";
  render();
}

function addProductToCart(product){

  if(existing){ existing.quantity += 1; existing.line_total = existing.quantity*existing.unit_price; }
  else state.cart.push({ product_id: product.id, description: product.name, quantity:1, unit_price: product.price, line_total: product.price });

function changeQty(idx, delta){

}

/* ============ إنشاء الفاتورة ============ */
async function confirmInvoice(){
  if(state.checkoutLoading) return;
  if(state.cart.length===0){ showToast("السلة فارغة، أضف صنف أو بند يدوي أولاً"); return; }
  state.checkoutLoading = true; render();

  try{
    if(!state.checkout.customerId){
      const qName = document.getElementById('quick-cu-name')?.value.trim();
      const qWa = document.getElementById('quick-cu-wa')?.value.trim();
      if(qName){
        const { data: newCu, error: cuErr } = await sb.from('customers').insert({ name: qName, whatsapp: qWa||null, phone: qWa||null, user_id: state.user.id }).select().single();
        if(!cuErr && newCu){
          state.customers = [newCu, ...state.customers];
          state.checkout.customerId = newCu.id;
        }
      }
    }

    const subtotal = cartSubtotal();
    const discount = parseFloat(state.checkout.discount)||0;
    const total = Math.max(0, Math.round((subtotal - discount)*100)/100);
    const tax = Math.round((total - (total/1.15))*100)/100;

    const { data: numData, error: numErr } = await sb.rpc('generate_invoice_number', { p_user_id: state.user.id });
    if(numErr){ showToast("خطأ بترقيم الفاتورة: "+numErr.message); state.checkoutLoading=false; render(); return; }

    const invoicePayload = {
      user_id: state.user.id,
      invoice_number: numData,
      customer_id: state.checkout.customerId || null,
      subtotal, discount, tax, total,
      status: state.checkout.status,
      payment_method: state.checkout.payment,
    };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invoicePayload).select().single();
    if(invErr){ showToast("خطأ: "+invErr.message); state.checkoutLoading=false; render(); return; }

    const items = state.cart.map(i=>({
      invoice_id: inv.id, product_id: i.product_id, description: i.description,
      quantity: i.quantity, unit_price: i.unit_price, line_total: i.line_total
    }));
    await sb.from('invoice_items').insert(items);

    const customer = state.customers.find(c=>c.id===state.checkout.customerId);
    state.lastInvoice = { ...inv, items, customer: customer||null };
    state.invoices = [{...inv, customers: customer?{name:customer.name}:null}, ...state.invoices];
    state.cart = [];
    state.checkout = { customerId:"", payment:"cash", discount:0, status:"paid" };
    state.modal = null;
    state.viewingHistorical = false;
    state.view = "invoice_view";
  } finally {
    state.checkoutLoading = false;
    render();
  }
}

/* ============ توليد PDF (بالتقاط تصيير المتصفح لدعم العربي والشعار) ============ */
async function generatePdfBlob(){
  const inv = state.lastInvoice, c = state.company;
  const capture = document.getElementById('pdf-capture');
  capture.innerHTML = invoiceReceiptHTML(inv, c);
  renderQrInto(`qr-holder-${inv.id}`, inv, c);
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  await new Promise(r=>setTimeout(r, 300));
  const canvas = await html2canvas(capture, { scale:2.5, useCORS:true, backgroundColor:'#ffffff', foreignObjectRendering:true });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdfWidth = 80;
  const pdfHeight = canvas.height * pdfWidth / canvas.width;
  const doc = new jsPDF({ unit:'mm', format:[pdfWidth, pdfHeight] });
  doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
  capture.innerHTML = '';
  return doc.output('blob');
}

/* ============ لوحة التحكم ============ */
function dashDateRange(){
  const today = new Date();
  let from, to;
  if(state.dashRange==='today'){ from = isoDay(today); to = isoDay(today); }
  else if(state.dashRange==='week'){ const d=new Date(today); d.setDate(d.getDate()-6); from=isoDay(d); to=isoDay(today); }
  else if(state.dashRange==='month'){ const d=new Date(today); d.setDate(d.getDate()-29); from=isoDay(d); to=isoDay(today); }
  else { from = state.dashFrom || isoDay(today); to = state.dashTo || isoDay(today); }
  return {from, to};
}
function computeDashboard(){
  const {from, to} = dashDateRange();
  const inRange = state.invoices.filter(i=>{ const d=isoDay(i.created_at); return d>=from && d<=to && i.status!=='cancelled'; });
  const totalSales = inRange.reduce((s,i)=>s+parseFloat(i.total),0);

  const dayList = [];
  let cur = new Date(from);
  const end = new Date(to);
  while(cur<=end && dayList.length<60){ dayList.push(isoDay(cur)); cur.setDate(cur.getDate()+1); }
  const dailyTotals = dayList.map(day => inRange.filter(i=>isoDay(i.created_at)===day).reduce((s,i)=>s+parseFloat(i.total),0));

  const today = isoDay(new Date());
  const todayInvoices = state.invoices.filter(i=>isoDay(i.created_at)===today && i.status!=='cancelled');
  const byPayment = {cash:0, card:0, transfer:0};
  todayInvoices.forEach(i=>{ byPayment[i.payment_method] = (byPayment[i.payment_method]||0) + parseFloat(i.total); });

  return { totalSales, countInRange: inRange.length, dayList, dailyTotals, customersCount: state.customers.length,
           todaySales: todayInvoices.reduce((s,i)=>s+parseFloat(i.total),0), todayCount: todayInvoices.length, byPayment };
}

function groupInvoicesByDay(invoices){
  const today = isoDay(new Date());
  const yestD = new Date(); yestD.setDate(yestD.getDate()-1);
  const yesterday = isoDay(yestD);
  const groups = {};
  invoices.forEach(inv=>{
    const day = isoDay(inv.created_at);
    if(!groups[day]) groups[day] = [];
    groups[day].push(inv);
  });
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(day=>({
    label: day===today ? 'اليوم' : day===yesterday ? 'أمس' : fmtDate(day),
    invoices: groups[day]
  }));
}

      <p style="font-weight:700;font-size:14px;margin-bottom:10px;">المبيعات (${fmtDate(from)} - ${fmtDate(to)})</p>
      <canvas id="salesChart" height="180"></canvas>
    </div>

    <div class="card">
      <p style="font-weight:700;font-size:14px;margin-bottom:12px;">تقرير نهاية اليوم (إغلاق الصندوق)</p>
      <div class="between" style="margin-bottom:8px;"><span class="muted" style="font-size:13px;">إجمالي مبيعات اليوم</span><span style="font-weight:700;">${money(d.todaySales)} ر.س</span></div>
      <div class="between" style="margin-bottom:12px;"><span class="muted" style="font-size:13px;">عدد فواتير اليوم</span><span style="font-weight:700;">${d.todayCount}</span></div>
      <div style="border-top:1px solid var(--border);padding-top:10px;">
        <div class="between" style="font-size:13px;padding:4px 0;"><span>نقدي</span><span>${money(d.byPayment.cash||0)}</span></div>
        <div class="between" style="font-size:13px;padding:4px 0;"><span>شبكة</span><span>${money(d.byPayment.card||0)}</span></div>
        <div class="between" style="font-size:13px;padding:4px 0;"><span>تحويل</span><span>${money(d.byPayment.transfer||0)}</span></div>
      </div>
    </div>
  </div>`;
}
let chartInstance = null;
function drawChart(d){
  const canvas = document.getElementById('salesChart');
  if(!canvas) return;
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(canvas, {
    type:'bar',
    data:{ labels: d.dayList.map(x=>x.slice(5)), datasets:[{ data: d.dailyTotals, backgroundColor:'#4F46E5', borderRadius:6 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true} } }
  });
}

function renderMoreSheet(){
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.navMoreOpen=false;render();}">
    <div class="modal-sheet" style="padding-bottom:24px;">
      <div class="modal-title"><span>المزيد</span><button onclick="state.navMoreOpen=false;render()">${ICONS.x}</button></div>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='customers_page';render()">${ICONS.user} العملاء</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.view='products_page';render()">${ICONS.box} المنتجات</button>
      <button class="btn btn-outline btn-block" style="margin-bottom:10px;justify-content:flex-start;" onclick="state.navMoreOpen=false;state.contactDraft=[];state.view='setup_company';render()">${ICONS.settings} بيانات المنشأة</button>
      <button class="btn btn-outline btn-block" style="color:var(--danger);justify-content:flex-start;" onclick="handleLogout()">${ICONS.logout} تسجيل الخروج</button>
    </div>
  </div>`;
}

function renderEditInvoiceModal(){
  const e = state.editInvoice;
  const total = Math.max(0, (parseFloat(e.subtotal)||0) - (parseFloat(e.discount)||0));
  return `
  <div class="modal-overlay" onclick="if(event.target===this){state.modal=null;state.editInvoice=null;render();}">
    <div class="modal-sheet">
      <div class="modal-title"><span>تعديل فاتورة #${e.invoice_number}</span><button onclick="state.modal=null;state.editInvoice=null;render()">${ICONS.x}</button></div>

      <div class="field">
        <label>العميل</label>
        <select onchange="state.editInvoice.customer_id=this.value">
          <option value="">اختر العميل</option>
          ${state.customers.map(c=>`<option value="${c.id}" ${e.customer_id===c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </div>

      <div class="field"><label>الخصم (ر.س)</label><input type="number" value="${e.discount}" oninput="state.editInvoice.discount=this.value;refreshEditTotal();"></div>

      <label style="margin-bottom:8px;">طريقة الدفع</label>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        ${['cash','card','transfer'].map(m=>`
          <button class="btn ${e.payment_method===m?'btn-primary':'btn-outline'}" style="flex-direction:column;padding:10px 4px;font-size:12px;" onclick="state.editInvoice.payment_method='${m}';render()">
            ${m==='cash'?ICONS.cash:m==='card'?ICONS.card:ICONS.bank}${payLabel(m)}
          </button>
        `).join('')}
      </div>

      <label style="margin-bottom:8px;">الحالة</label>
      <div class="grid2" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
        ${['paid','unpaid','cancelled'].map(s=>`
          <button class="btn ${e.status===s?'btn-primary':'btn-outline'}" style="font-size:12px;padding:9px 4px;" onclick="state.editInvoice.status='${s}';render()">${statusLabel(s)}</button>
        `).join('')}
      </div>

      <div class="card" style="background:var(--bg);border:none;margin-bottom:16px;">
        <div class="between" style="font-size:13px;color:var(--text-2);"><span>المجموع الفرعي</span><span>${money(e.subtotal)}</span></div>
        <div class="between" style="font-size:18px;font-weight:700;margin-top:6px;"><span>الإجمالي</span><span id="edit-total" style="color:var(--primary);">${money(total)} ر.س</span></div>
      </div>

      <button class="btn btn-primary btn-block" onclick="submitEditInvoice()">حفظ التعديلات</button>
    </div>
  </div>`;
}
function refreshEditTotal(){
  const e = state.editInvoice;
  const total = Math.max(0, (parseFloat(e.subtotal)||0) - (parseFloat(e.discount)||0));
  document.getElementById('edit-total').textContent = money(total)+' ر.س';
}

function openModal(name){ state.modal = name; render(); }

function renderBottomNav(){
  if(['auth','setup_company','loading','reset_password'].includes(state.view)) return '';
  const items = [
    {id:'pos', label:'البيع', icon:ICONS.home},
    {id:'invoices_page', label:'الفواتير', icon:ICONS.list},
    {id:'dashboard', label:'التحكم', icon:ICONS.chart},
    {id:'more', label:'المزيد', icon:ICONS.more},
  ];
  return `<div class="bottomnav">
    ${items.map(it=>`
      <button class="navitem ${state.view===it.id?'active':''}" onclick="${it.id==='more'?'state.navMoreOpen=true;render()':`state.view='${it.id}';render()`}">
        ${it.icon}<span>${it.label}</span>
      </button>
    `).join('')}
  </div>`;
}

/* ============ التوجيه الرئيسي ============ */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.view){
    case 'loading': html = `<div style="min-height:100vh;" class="center"><div class="spinner spinner-dark" style="width:28px;height:28px;"></div></div>`; break;
    case 'auth': html = renderAuth(); break;
    case 'reset_password': html = renderResetPassword(); break;
    case 'setup_company': html = renderSetupCompany(); break;
    case 'pos': html = renderPOS(); break;
    case 'invoice_view': html = renderInvoiceView(); break;
    case 'invoices_page': html = renderInvoicesPage(); break;
    case 'customers_page': html = renderCustomersPage(); break;
    case 'products_page': html = renderProductsPage(); break;
    case 'dashboard': html = renderDashboard(); break;
    default: html = renderPOS();
  }
  html += renderBottomNav();
  if(state.modal==='checkout') html += renderCheckoutModal();
  if(state.modal==='add_customer') html += renderCustomerModal();
  if(state.modal==='add_product') html += renderProductModal();
  if(state.modal==='print_choice') html += renderPrintChoiceModal();
  if(state.modal==='edit_invoice') html += renderEditInvoiceModal();
  if(state.navMoreOpen) html += renderMoreSheet();
  if(state.toastMsg) html += `<div class="toast">${state.toastMsg}</div>`;
  app.innerHTML = html;
}

initApp();
</script>
</body>
</html>
